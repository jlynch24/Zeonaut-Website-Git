<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuonaut TTRPG - Sign Up</title>
    <link rel="stylesheet" href="/client/css/index.css">
    <!--Defer fixes the issue-->
    <script src="/client/javascript/signup.js" defer></script>
</head>
<body>
    <main>
        <section> <!--holds title and links-->
            <div class="title">Zuonaut</div>
            <div class="link-container"> 
                <a class="link" href="/client/genPages/index.html">Main</a>
                <a class="link" href="/rules">Rules</a>
                <a class="link" href="/lore">Lore</a>
                <a class="link" href="/signup">Sign Up</a>
                <a class="link" href="/login">Log In</a>
                <a class="link" href="/ccmenu">Character Creation</a>
                <a class="link" href="https://simple.wikipedia.org/wiki/Pufferfish" target="_blank">Pufferfish</a>
            </div>
        </section>
        <section> <!--Sigh up-->
            <h2 class="white">Don't have an accout?</h2>
            <h1 class="white">Create one today!</h1>

            <form>
                <label class="white">Your Email</label>
                <input type="text" id="email" required>
            
                <label class="white">Your Username</label>
                <input type="text" id="username" required>

                <label class="white">Your Password</label>
                <input type="text" id="password" required> <!--Had the password ID this ENTIRE TIME and none of us noticed!-->

                <button id="signUpButton">Sign Up</button> <!--Tried a more simpler thing than messing around with myclick.-->
            </form>
        </section>
    </main>
</body>
